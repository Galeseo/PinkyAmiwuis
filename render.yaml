# Blueprint de Render. Con este archivo en el repo, Render configura el
# servicio solo: New > Blueprint en vez de rellenar el formulario a mano.
services:
  - type: web
    name: pokeapi-py
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 'python -m gunicorn' en vez de 'gunicorn' a secas: si el script de
    # consola no queda en el PATH (pasa cuando el build instala en un
    # virtualenv distinto), el arranque muere con "command not found" (127).
    # Invocarlo como módulo usa el mismo intérprete que hizo el pip install.
    startCommand: python -m gunicorn pokeapi.web:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # El disco de Render es efímero y solo /tmp es escribible con garantías.
      # La caché sobrevive mientras la instancia siga viva, que es lo que
      # importa para no machacar la PokéAPI.
      - key: POKEAPI_CACHE_DIR
        value: /tmp/pokeapi-cache
