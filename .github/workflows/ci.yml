name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Ninguno toca la red: las respuestas de la PokéAPI van mockeadas.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: El paquete instala
        run: |
          pip install .
          python -c "import pokeapi; print('pokeapi', pokeapi.__version__)"
          pokeapi --help > /dev/null

  smoke:
    name: Arranque real del servidor
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias de producción
        run: pip install -r requirements.txt

      # Este paso existe por un fallo real: 'gunicorn' a secas no estaba en el
      # PATH de Render y el deploy moría con status 127. Aquí se comprueba el
      # comando exacto que usa render.yaml antes de desplegar nada.
      - name: Arranca con el start command de Render
        run: |
          PORT=8000 python -m gunicorn pokeapi.web:app \
            --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60 &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status": "ok"'
          curl -fsS http://localhost:8000/ > /dev/null
          pkill -f gunicorn

      # Plan B: la app tiene que arrancar también sin gunicorn.
      - name: Arranca solo con la librería estándar
        run: |
          PORT=8001 python -m pokeapi.web &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8001/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8001/health | grep -q '"status": "ok"'
          pkill -f pokeapi.web

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Solo desde main y solo en push: los PR no despliegan.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Lanzar el deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL."
            echo "Créalo en Settings > Secrets and variables > Actions con la"
            echo "URL del Deploy Hook del servicio en Render."
            exit 1
          fi
          echo "Lanzando deploy en Render…"
          curl -fsS -X POST "$HOOK" -o response.json -w "HTTP %{http_code}\n"
          cat response.json

      - name: Resumen
        run: |
          echo "### Deploy lanzado :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El build corre en Render; sigue el progreso en su dashboard." >> $GITHUB_STEP_SUMMARY
          echo "Servicio: https://pinkyamiwuis.onrender.com" >> $GITHUB_STEP_SUMMARY
